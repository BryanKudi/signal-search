name: Tests and containers

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: signal-search:ci-${{ matrix.tag }}

      - name: Run container smoke test
        env:
          IMAGE_TAG: signal-search:ci-${{ matrix.tag }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          container_id=$(docker run --detach --platform "$TARGET_PLATFORM" --publish 8000:8000 "$IMAGE_TAG")
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in {1..20}; do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              break
            fi
            sleep 1
          done
          python scripts/smoke_test.py
